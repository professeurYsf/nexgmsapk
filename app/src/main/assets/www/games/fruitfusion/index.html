<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EAF6FF">
<title>Fusion de Fruits</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<script src="../../shared/shared.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shared.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="iconbtn" id="btnHome" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
    </button>
    <span class="topbar-title" data-i18n="game.title">Fusion de Fruits</span>
    <button class="iconbtn" id="btnPause" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>
    </button>
  </header>

  <div class="statsbar">
    <div class="stat-chip score-chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 8v8l8 6 8-6V8l-8-6Z"/></svg>
      <span data-i18n="game.score">Score</span>
      <strong id="scoreDisplay">0</strong>
    </div>
    <div class="stat-chip">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 4h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4M7 4H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M9 20h6M12 15v5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <span data-i18n="game.best">Record</span>
      <strong id="bestDisplay">0</strong>
    </div>
    <div class="stat-chip next-chip">
      <span data-i18n="game.next">Suivant</span>
      <img id="nextImg" alt="">
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board-frame" id="boardFrame">
      <canvas id="board"></canvas>
      <svg class="hammer-fx" id="hammerFx" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="hw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0a566"/><stop offset="1" stop-color="#a8692f"/></linearGradient>
          <linearGradient id="hm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f4fa"/><stop offset="1" stop-color="#8794ad"/></linearGradient>
        </defs>
        <rect x="44" y="30" width="12" height="62" rx="6" fill="url(#hw)" stroke="#6b3f17" stroke-width="2.4" transform="rotate(-38 50 60)"/>
        <rect x="14" y="8" width="64" height="30" rx="9" fill="url(#hm)" stroke="#4d5a73" stroke-width="2.6" transform="rotate(-38 50 60)"/>
        <rect x="20" y="12" width="52" height="7" rx="3.5" fill="#fff" opacity=".55" transform="rotate(-38 50 60)"/>
      </svg>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool" id="btnHammer" aria-label="Marteau">
      <svg viewBox="0 0 24 24" fill="currentColor"><g transform="rotate(40 12 12)"><rect x="4.5" y="2.5" width="15" height="8" rx="2.4"/><rect x="10.3" y="9.5" width="3.4" height="12.5" rx="1.7" opacity=".92"/><rect x="6.2" y="4.2" width="11.6" height="1.6" rx=".8" fill="#fff" opacity=".35"/></g></svg>
      <span class="badge" id="hammerCount">1</span>
    </button>
    <div class="chain" id="chain"></div>
  </div>

  <!-- SETUP -->
  <div class="overlay" id="setupOverlay">
    <div class="panel">
      <div class="sheet-handle"></div>
      <button class="panel-help" id="btnHelp" aria-label="Comment jouer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 0 1 4.86.86c0 1.6-2.16 2-2.36 3.3" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="panel-logo"><img src="logo.png" alt="Fusion de Fruits"></div>
      <h2 data-i18n="game.title">Fusion de Fruits</h2>
      <p class="panel-sub" data-i18n="game.subtitle">Fusionne les fruits identiques jusqu’à la pastèque</p>
      <button class="startbtn" id="btnStart">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span data-i18n="game.start">Commencer</span>
      </button>
      <button class="quitbtn" id="btnExitSetup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H9"/><path d="M13 8l4 4-4 4M17 12H9" stroke-linejoin="round"/></svg>
        <span data-i18n="game.quit">Quitter</span>
      </button>
    </div>
  </div>

  <!-- PAUSE -->
  <div class="overlay hidden" id="pauseOverlay">
    <div class="panel pause-panel">
      <div class="sheet-handle"></div>
      <h2 data-i18n="pause.title">🎮 Jeu en pause</h2>
      <button class="startbtn" id="btnResume">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span data-i18n="pause.resume">Continuer</span>
      </button>
      <button class="rematchbtn" id="btnPauseRestart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span data-i18n="pause.restart">Recommencer</span>
      </button>
      <button class="quitbtn" id="btnPauseMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
        <span data-i18n="pause.menu">Menu des jeux</span>
      </button>
    </div>
  </div>

  <!-- HELP -->
  <div class="overlay hidden" id="helpOverlay">
    <div class="panel">
      <div class="sheet-handle"></div>
      <h2 data-i18n="help.title">Comment jouer</h2>
      <ul class="help-list">
        <li data-i18n="help.li1"></li>
        <li data-i18n="help.li2"></li>
        <li data-i18n="help.li3"></li>
        <li data-i18n="help.li4"></li>
      </ul>
      <button class="startbtn" id="btnHelpClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        <span data-i18n="help.close">Compris</span>
      </button>
    </div>
  </div>

  <!-- HAMMER CONFIRM -->
  <div class="overlay hidden" id="hammerOverlay">
    <div class="panel pause-panel">
      <div class="sheet-handle"></div>
      <h2 data-i18n="hammer.title">Utiliser le marteau ?</h2>
      <div class="confirm-fruits" id="confirmFruits"></div>
      <p class="confirm-text" data-i18n="hammer.text"></p>
      <button class="startbtn amber" id="btnHammerUse">
        <svg viewBox="0 0 24 24" fill="currentColor"><g transform="rotate(40 12 12)"><rect x="4.5" y="2.5" width="15" height="8" rx="2.4"/><rect x="10.3" y="9.5" width="3.4" height="12.5" rx="1.7"/></g></svg>
        <span data-i18n="hammer.use">Utiliser</span>
      </button>
      <button class="quitbtn" id="btnHammerCancel"><span data-i18n="hammer.cancel">Annuler</span></button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="overOverlay">
    <div class="result-panel">
      <div class="sheet-handle"></div>
      <div class="banner over-banner" data-i18n="over.banner">Partie terminée</div>
      <p class="new-record hidden" id="overNewRecord" data-i18n="result.record">Nouveau record !</p>
      <div class="win-stats">
        <div class="win-stat"><span data-i18n="game.score">Score</span><strong id="overScore">0</strong></div>
        <div class="win-stat"><span data-i18n="game.best">Record</span><strong id="overBest">0</strong></div>
      </div>
      <button class="rematchbtn" id="btnOverRestart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span data-i18n="result.again">Rejouer</span>
      </button>
      <button class="quitbtn" id="btnOverMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
        <span data-i18n="result.menu">Menu des jeux</span>
      </button>
    </div>
  </div>

  <div id="confetti-container"></div>
</div>

<script src="fruits.js"></script>
<script src="script.js"></script>
</body>
</html>
