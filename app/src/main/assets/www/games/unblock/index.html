<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EAF6FF">
<title>Unblock Puzzle</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<script src="../../shared/shared.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shared.css">
</head>
<body>
<div id="app">

  <!-- Top bar: Home (back to Game Collection) + Pause -->
  <header class="topbar">
    <button class="iconbtn" id="homeBtn" aria-label="Back to Game Collection">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
    </button>

    <span class="topbar-title" data-i18n="game.title">Unblock Puzzle</span>

    <button class="iconbtn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
  </header>

  <!-- Level / moves / hint -->
  <div class="statbar">
    <div class="chip"><span class="chip-l" data-i18n="stat.level">Level</span><b id="lvlNum">1</b></div>
    <div class="chip"><span class="chip-l" data-i18n="stat.moves">Moves</span><b id="moveNum">0</b></div>
    <div class="chip chip-min"><span class="chip-l" data-i18n="stat.min">Best</span><b id="minNum">0</b></div>
    <button class="iconbtn" id="restartLvlBtn" aria-label="Restart level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg></button>
    <button class="hintbtn" id="hintBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span data-i18n="stat.hint">Hint</span><i class="hint-badge" id="hintBadge">2</i></button>
  </div>
  <div class="toast hidden" id="toast"></div>

  <!-- Board -->
  <div class="board-wrap">
    <div class="board-frame">
      <canvas id="board"></canvas>
    </div>
  </div>

  <!-- LEVEL SELECT (this game's own home screen) -->
  <div class="overlay" id="setupOverlay">
    <div class="panel levels-panel">
      <div class="sheet-handle"></div>
      <button class="panel-help" id="helpBtn" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 0 1 4.86.86c0 1.6-2.36 2-2.36 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
      <div class="panel-logo"><img src="logo.png" alt="Unblock Puzzle"></div>
      <h2 data-i18n="game.title">Unblock Puzzle</h2>
      <p class="panel-sub" data-i18n="setup.subtitle">Slide the blocks to free the red one</p>
<!-- Start screen -->
      <div id="startView">
        <button class="startbtn" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span data-i18n="setup.start">Start</span></button>
        <button class="quitbtn" id="setupQuitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H9"/><path d="M16 8l4 4-4 4M20 12H9"/></svg><span data-i18n="setup.quit">Quit</span></button>
      </div>

      <!-- Levels (shown after Start) -->
      <div id="levelsView" class="hidden">
            <div class="section-label" data-i18n="levels.pick">Choose a level</div>
      <div class="levels-grid" id="levelsGrid"></div>
        <button class="quitbtn" id="levelsBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span data-i18n="setup.back">Back</span></button>
      </div>
    </div>
  </div>

  <!-- PAUSE OVERLAY -->
  <div class="overlay hidden" id="pauseOverlay">
    <div class="panel pause-panel">
      <div class="sheet-handle"></div>
      <h2 data-i18n="pause.title">Game Paused</h2>
      <button class="startbtn" id="resumeBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span data-i18n="pause.resume">Resume</span>
      </button>
      <button class="rematchbtn" id="pauseRestartBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span data-i18n="pause.restart">Restart</span>
      </button>
      <button class="quitbtn" id="pauseMenuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
        <span data-i18n="pause.gameMenu">Levels</span>
      </button>
    </div>
  </div>

  <!-- HELP OVERLAY -->
  <div class="overlay hidden" id="helpOverlay">
    <div class="panel">
      <div class="sheet-handle"></div>
      <h2 data-i18n="help.title">How To Play</h2>
      <ul class="help-list">
        <li data-i18n="help.line1"></li>
        <li data-i18n="help.line2"></li>
        <li data-i18n="help.line3"></li>
        <li data-i18n="help.line4"></li>
      </ul>
      <button class="startbtn" id="helpCloseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        <span data-i18n="help.close">Got it</span>
      </button>
    </div>
  </div>

  <!-- LEVEL COMPLETE -->
  <div class="overlay hidden" id="resultOverlay">
    <div class="result-panel">
      <div class="sheet-handle"></div>
      <div class="banner" id="resultBanner">LEVEL COMPLETE!</div>
      <div class="stars" id="resultStars"></div>
      <div class="scoreline" id="resultScore">0</div>
      <div class="trophyline"><span id="resultTrophy"></span></div>
      <button class="startbtn" id="nextBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span data-i18n="result.next">Next level</span></button>
      <button class="rematchbtn" id="rematchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg><span data-i18n="result.retry">Replay</span></button>
      <button class="quitbtn" id="quitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-i18n="result.levels">Levels</span></button>
    </div>
  </div>

</div>

<script src="levels.js"></script>
<script src="script.js"></script>
</body>
</html>
