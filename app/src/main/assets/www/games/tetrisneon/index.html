<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EAF6FF">
<title>Neon Blocks</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<script src="../../shared/shared.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shared.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="iconbtn" id="homeBtn" aria-label="Back to Game Collection">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
    </button>
    <span class="topbar-title" data-i18n="title">Neon Blocks</span>
    <button class="iconbtn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
  </header>

  <main class="play" id="play">
    <div class="field" id="field">
      <div class="board-frame" id="boardbox"><canvas id="board"></canvas></div>
      <aside class="side" id="side">
        <div class="chip next"><span class="chip-l" data-i18n="next">NEXT</span><canvas id="next" width="80" height="80"></canvas></div>
        <div class="chip score"><span class="chip-l" data-i18n="score">SCORE</span><b id="score">0</b></div>
        <div class="chip bestc"><span class="chip-l" data-i18n="best">BEST</span><b id="best">0</b></div>
        <div class="chip"><span class="chip-l" data-i18n="level">LEVEL</span><b id="level">1</b></div>
        <div class="chip"><span class="chip-l" data-i18n="lines">LINES</span><b id="lines">0</b></div>
      </aside>
    </div>
  </main>

  <footer class="controls" id="controls">
    <div class="dpad">
      <button class="cbtn sq" id="btnLeft" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="left">LEFT</span></button>
      <button class="cbtn sq" id="btnDown" aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg><span data-i18n="down">DOWN</span></button>
      <button class="cbtn sq" id="btnRight" aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg><span data-i18n="right">RIGHT</span></button>
    </div>
    <button class="cbtn sq" id="btnRotate" aria-label="Rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span data-i18n="rotate">ROTATE</span></button>
  </footer>

  <!-- START -->
  <div class="overlay" id="startOverlay">
    <div class="panel">
      <div class="sheet-handle"></div>
      <button class="panel-help" id="helpBtn" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 0 1 4.86.86c0 1.6-2.36 2-2.36 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
      <div class="panel-logo"><img src="logo.png" alt=""></div>
      <h2 data-i18n="title">Neon Blocks</h2>
      <p class="panel-sub" data-i18n="subtitle">Stack, clear lines, beat your best</p>
      <div class="best-line"><span data-i18n="best">BEST</span><strong id="startBest">0</strong></div>
      <button class="startbtn" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span data-i18n="start">START</span></button>
      <p class="hint" data-i18n="keys">Keyboard: ← → move · ↓ drop · ↑ / Space rotate · P pause</p>
      <button class="quitbtn" id="startQuit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H9"/><path d="M13 8l4 4-4 4M17 12H9" stroke-linejoin="round"/></svg><span data-i18n="quit">Quit</span></button>
    </div>
  </div>

  <!-- HELP -->
  <div class="overlay hidden" id="helpOverlay">
    <div class="panel">
      <div class="sheet-handle"></div>
      <h2 data-i18n="helpTitle">How To Play</h2>
      <ul class="help-list">
        <li data-i18n="help1"></li><li data-i18n="help2"></li><li data-i18n="help3"></li><li data-i18n="help4"></li>
      </ul>
      <button class="startbtn" id="helpClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg><span data-i18n="gotit">Got it</span></button>
    </div>
  </div>

  <!-- PAUSE -->
  <div class="overlay hidden" id="pauseOverlay">
    <div class="panel pause-panel">
      <div class="sheet-handle"></div>
      <h2 data-i18n="paused">PAUSED</h2>
      <button class="startbtn" id="resumeBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span data-i18n="resume">RESUME</span></button>
      <button class="rematchbtn" id="pauseRestart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span data-i18n="restart">RESTART</span></button>
      <button class="quitbtn" id="pauseHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg><span data-i18n="home">Back Home</span></button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="overOverlay">
    <div class="result-panel">
      <div class="sheet-handle"></div>
      <div class="banner lose" data-i18n="gameover">GAME OVER</div>
      <p class="record hidden" id="recordMsg"></p>
      <div class="win-stats">
        <div class="win-stat"><span data-i18n="score">SCORE</span><strong id="oScore">0</strong></div>
        <div class="win-stat"><span data-i18n="level">LEVEL</span><strong id="oLevel">1</strong></div>
        <div class="win-stat"><span data-i18n="lines">LINES</span><strong id="oLines">0</strong></div>
      </div>
      <div class="best-line"><span data-i18n="best">BEST</span><strong id="oBest">0</strong></div>
      <button class="rematchbtn" id="againBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span data-i18n="again">PLAY AGAIN</span></button>
      <button class="quitbtn" id="overHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg><span data-i18n="home">Back Home</span></button>
    </div>
  </div>

  <div id="confetti-container"></div>
</div>
<script src="script.js"></script>
</body>
</html>
