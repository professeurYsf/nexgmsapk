<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EAF6FF">
<title>Stop the Timer</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<script src="../../shared/shared.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shared.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="iconbtn" id="btnBack" aria-label="Retour">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <span class="topbar-title">Stop the Timer</span>
    <button class="iconbtn" id="btnRestart" aria-label="Recommencer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </header>

  <div class="statsbar">
    <div class="stat-chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
      <span id="roundChip">1/3</span>
    </div>
    <div class="stat-chip">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
      <span id="scoreChip">0</span>
    </div>
    <div class="stat-chip">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 4h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4M7 4H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M9 20h6M12 15v5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <span id="bestChip">—</span>
    </div>
  </div>

  <main class="stage" id="stage" data-phase="ready" data-mode="solo">
    <div class="target-card" id="targetCard">
      <div class="target-label" data-i18n="target">Cible</div>
      <div class="target-val" id="targetVal">0,00 s</div>
    </div>

    <div class="center">
      <p class="hint" id="hintText"></p>
      <div class="ring" id="ring"><i class="curtain top" id="cTop"></i><i class="curtain bot" id="cBot"></i><span id="ringText">⏱</span></div>
    </div>

    <div class="controls">
      <button class="startbtn readybtn" id="btnReady">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span data-i18n="ready">Je suis prêt</span>
      </button>
      <button class="stopbtn" id="btnStop" disabled data-i18n="stop">STOP</button>
      <div class="duo">
        <button class="pbtn red" id="btnP1" disabled><span class="pnum">1</span><span class="plabel" id="lblP1">Joueur 1</span></button>
        <button class="pbtn blue" id="btnP2" disabled><span class="pnum">2</span><span class="plabel" id="lblP2">Joueur 2</span></button>
      </div>
    </div>
  </main>

  <div class="toast hidden" id="toast"></div>

  <!-- SETUP -->
  <div class="overlay" id="setupOverlay">
    <div class="panel">
      <div class="sheet-handle"></div>
      <button class="panel-help" id="btnHelp" aria-label="Comment jouer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 0 1 4.86.86c0 1.6-2.16 2-2.36 3.3" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="panel-logo"><img src="logo.png" alt="Stop the Timer"></div>
      <h2>Stop the Timer</h2>
      <p class="panel-sub" data-i18n="subtitle">Jeu de précision : arrête le chrono au bon moment</p>

      <div class="section-label" data-i18n="mode">Mode de jeu</div>
      <div class="optrow">
        <button class="optbtn active" id="modeSolo" data-mode="solo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
          <span data-i18n="solo">Solo</span>
        </button>
        <button class="optbtn" id="modeDuo" data-mode="duo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="9" r="3"/><path d="M2.5 19c0-2.8 2.4-4.6 5.5-4.6s5.5 1.8 5.5 4.6M13 15c.8-.4 1.8-.6 2.8-.6 3 0 5.7 1.8 5.7 4.6"/></svg>
          <span data-i18n="duo">2 joueurs</span>
        </button>
      </div>

      <button class="startbtn" id="btnStart">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span data-i18n="start">Commencer</span>
      </button>
      <button class="quitbtn" id="btnExitSetup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H9"/><path d="M13 8l4 4-4 4M17 12H9" stroke-linejoin="round"/></svg>
        <span data-i18n="quit">Quitter</span>
      </button>
    </div>
  </div>

  <!-- HELP -->
  <div class="overlay hidden" id="helpOverlay">
    <div class="panel">
      <div class="sheet-handle"></div>
      <h2 data-i18n="help.title">Comment jouer</h2>
      <ul class="help-list">
        <li data-i18n="help.li1"></li><li data-i18n="help.li2"></li><li data-i18n="help.li3"></li><li data-i18n="help.li4"></li><li data-i18n="help.li5"></li>
      </ul>
      <button class="startbtn" id="btnHelpClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        <span data-i18n="close">Compris</span>
      </button>
    </div>
  </div>

  <!-- RESULT: solo round -->
  <div class="overlay hidden" id="roundOverlay">
    <div class="result-panel">
      <div class="sheet-handle"></div>
      <div class="banner" id="roundBanner"></div>
      <p class="sub-line" id="roundSub"></p>
      <div class="win-stats">
        <div class="win-stat"><span data-i18n="target">Cible</span><strong id="rTarget">-</strong></div>
        <div class="win-stat"><span data-i18n="actual">Réel</span><strong id="rActual">-</strong></div>
        <div class="win-stat"><span data-i18n="gap">Écart</span><strong id="rGap">-</strong></div>
      </div>
      <p class="pts-line" id="rPts"></p>
      <button class="rematchbtn" id="btnNextRound"><span id="nextRoundLbl"></span></button>
    </div>
  </div>

  <!-- RESULT: solo final -->
  <div class="overlay hidden" id="finalOverlay">
    <div class="result-panel">
      <div class="sheet-handle"></div>
      <div class="banner" data-i18n="final.banner">🏁 Partie terminée</div>
      <p id="newRecord" class="new-record hidden" data-i18n="record">Nouveau record !</p>
      <div class="win-stats">
        <div class="win-stat"><span data-i18n="final.score">Score total</span><strong id="fScore">0</strong></div>
        <div class="win-stat"><span data-i18n="final.precision">Précision moy.</span><strong id="fPrec">0%</strong></div>
        <div class="win-stat"><span data-i18n="final.best">Meilleur écart</span><strong id="fBest">-</strong></div>
      </div>
      <div class="round-list" id="roundList"></div>
      <button class="rematchbtn" id="btnReplay1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span data-i18n="replay">Rejouer</span></button>
      <button class="quitbtn" id="btnMode1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/></svg><span data-i18n="changeMode">Changer de mode</span></button>
      <button class="quitbtn" id="btnMenu1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg><span data-i18n="menu">Retour au menu</span></button>
    </div>
  </div>

  <!-- RESULT: duo -->
  <div class="overlay hidden" id="duoOverlay">
    <div class="result-panel">
      <div class="sheet-handle"></div>
      <div class="banner" id="duoBanner"></div>
      <p class="sub-line" id="duoTarget"></p>
      <div class="duo-rows" id="duoRows"></div>
      <button class="rematchbtn" id="btnReplay2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span data-i18n="replay">Rejouer</span></button>
      <button class="quitbtn" id="btnMode2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/></svg><span data-i18n="changeMode">Changer de mode</span></button>
      <button class="quitbtn" id="btnMenu2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg><span data-i18n="menu">Retour au menu</span></button>
    </div>
  </div>

  <div id="confetti-container"></div>
</div>
<script src="script.js"></script>
</body>
</html>
